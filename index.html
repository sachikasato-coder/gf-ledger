<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GF 台帳管理">
<title>GF 台帳管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.card{width:min(420px,100%);text-align:center}
.logo{width:150px;height:150px;border-radius:28px;object-fit:cover;margin-bottom:22px}
h1{font-size:30px;margin:0 0 10px}
p{color:#666;line-height:1.7}
button,a.btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:18px;padding:18px 16px;margin-top:18px;font-size:18px;font-weight:700;text-decoration:none;cursor:pointer}
button{background:#111;color:#fff}
a.btn{background:#eee;color:#111}
.small{font-size:13px;color:#999;margin-top:18px}
</style>
<script>
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function openGF(){
  if (isIOS()) {
    // iPhone/iPad: GASはSafariで開かず、Chromeアプリへ渡す
    window.location.href = 'googlechromes://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec';
  } else {
    // Android/PC: 通常のHTTPSで開く
    window.location.href = 'https://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec';
  }
}
</script>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="./icon.png" alt="GF 台帳管理">
    <h1>GF 台帳管理</h1>
    <p>車両・ドライバー管理</p>
    <button type="button" onclick="openGF()">GF 台帳管理を開く</button>
    <a class="btn" href="https://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec">通常ブラウザで開く</a>
    <div class="small">iPhoneは「GF 台帳管理を開く」からChromeを起動します。</div>
  </div>
</main>
</body>
</html>
