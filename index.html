<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GF 台帳管理">
<title>GF 台帳管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#171717}
main{max-width:520px;margin:auto;padding:44px 20px}
.card{background:#fff;border:1px solid #e6e6e6;border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.logo{width:118px;height:118px;margin:0 auto 18px}
h1{font-size:26px;margin:0 0 8px}
p{line-height:1.7;color:#666}
a.open{display:block;margin-top:24px;background:#111;color:#fff;text-decoration:none;border-radius:15px;padding:17px;font-size:17px;font-weight:800}
.help{margin-top:24px;padding:16px;background:#faf8f1;border-radius:14px;text-align:left;font-size:14px;line-height:1.7}
.small{font-size:12px;color:#888;margin-top:16px}
</style>
</head>
<body>
<main>
<div class="card">
<img class="logo" src="./icon.svg" alt="GF 台帳管理">
<h1>GF 台帳管理</h1>
<p>GOLD FIRST 車両・ドライバー管理</p>
<a class="open" href="https://script.google.com/macros/s/AKfycbzDrU44saPdqQLxP3yyTPA8UgGkbw0fWSkNcUZp9XCEF2QErzk5uQki4_4eVDVwl4Hw0g/exec">GF 台帳管理を開く</a>
<div class="help">
<b>ホーム画面に置く</b><br>
iPhone：共有メニュー →「ホーム画面に追加」<br>
Android：ブラウザメニュー →「ホーム画面に追加」または「アプリをインストール」
</div>
<div class="small">初回だけホーム画面へ追加すれば、次回からアイコンをタップして開けます。</div>
</div>
</main>
</body>
</html>
